workflows:
  android-build:
    name: Backdor IPTV - Android APK Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 17
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    scripts:
      - name: Generate Gradle Wrapper
        script: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug --stacktrace --no-daemon
    artifacts:
      - app/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - kizilordux@example.com
        notify:
          success: true
          failure: true
